[project]
name = "pchunter-platform"
version = "0.1.0"
description = "AI Agent protocol-confusion security assessment and governance platform (design-stage MVP)."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pchunter = "pchunter_platform.cli:main"
pchunter-assist = "pchunter_platform.assist.cli:assist_main"
pchunter-review = "pchunter_platform.assist.cli:review_main"
readme-inject-guard ="readme_inject_guard.cli:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
