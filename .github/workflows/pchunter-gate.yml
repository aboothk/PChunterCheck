name: pchunter-gate

on:
  push:
  pull_request:

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run contract, gateway, evaluator and scope unit tests
        run: pytest tests/ -v

      - name: Run the fixed four-case assessment suite (SDLC gate)
        run: python -m pchunter_platform.cli run-suite --junit artifacts/junit.xml
        # Exit code is 0 only when the gate verdict is PASS.

      - name: Run the before/after fix-regression demo
        run: python -m pchunter_platform.cli fix-regression

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pchunter-evidence
          path: |
            artifacts/**
          retention-days: 14

  agentdojo-path-a:
    # Path A (ground-truth replay) needs AgentDojo but NO model API and no
    # credentials, so it is safe to run on every push. It is the harness's
    # own self-check that decides whether the job passes -- a broken
    # harness must fail the build rather than silently publish numbers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and AgentDojo (pinned)
        run: |
          pip install -e ".[dev]"
          pip install "agentdojo==0.1.35"

      - name: Oracle self-check (must pass before any number is trusted)
        run: python -m pchunter_platform.integrations.agentdojo.cli --validate-oracle

      - name: Path A, plausible scope
        run: python -m pchunter_platform.integrations.agentdojo.cli --scope plausible --out artifacts/agentdojo-path-a/plausible

      - name: Path A, prompt-derived scope
        run: python -m pchunter_platform.integrations.agentdojo.cli --scope prompt_derived --out artifacts/agentdojo-path-a/prompt-derived

      - name: Upload Path A reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentdojo-path-a
          path: artifacts/agentdojo-path-a/**
          retention-days: 30

  readme-inject-guard:
    # Replay mode: reads recorded traces, calls no model, needs no secret.
    # Live mode (real dcode + model) is manual only; see README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/test_readme_inject_guard.py -v

      - name: Replay gate (exit 1 if the guard regresses on any sample)
        run: readme-inject-guard check --config guard.yaml --replay --junit artifacts/guard-junit.xml

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-inject-guard-junit
          path: artifacts/guard-junit.xml
          retention-days: 14
